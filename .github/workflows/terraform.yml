name: Terraform Azure Deployment

on:
  push:
    branches:
      - feature-vm

  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parent_module

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Azure Credentials
        shell: bash
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIAL }}
        run: |
          if [ -n "$AZURE_CREDS" ]; then
            echo "AZURE_CREDENTIAL secret is available"
          else
            echo "AZURE_CREDENTIAL secret is EMPTY or NOT AVAILABLE"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIAL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
